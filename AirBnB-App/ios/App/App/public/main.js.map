export default "<ion-app>\n  <ion-menu side=\"start\">\n    <ion-header>\n      <ion-toolbar color=\"primary\">\n        <ion-title>PairBNB</ion-title>\n      </ion-toolbar>\n    </ion-header>\n\n    <ion-content>\n      <ion-list>\n        <ion-menu-toggle>\n          <ion-item [routerLink]=\"'/places/discover'\">\n            <ion-icon name=\"business\" slot=\"start\"> </ion-icon>\n            <ion-label>Discover Places</ion-label>\n          </ion-item>\n        </ion-menu-toggle>\n\n        <ion-menu-toggle>\n          <ion-item [routerLink]=\"'/bookings/'\">\n            <ion-icon name=\"checkbox-outline\" slot=\"start\"> </ion-icon>\n            <ion-label>Bookings</ion-label>\n          </ion-item>\n        </ion-menu-toggle>\n\n        <ion-menu-toggle>\n          <ion-item (click)=\"onSignOut()\">\n            <ion-icon name=\"exit\"  slot=\"start\"> </ion-icon>\n            <ion-label>Logout</ion-label>\n          </ion-item>\n        </ion-menu-toggle>\n      </ion-list>\n    </ion-content>\n  </ion-menu>\n  <ion-router-outlet main></ion-router-outlet>\n</ion-app>\n";
