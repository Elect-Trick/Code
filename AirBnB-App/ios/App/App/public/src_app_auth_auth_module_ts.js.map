export default "<ion-header>\n  <ion-toolbar color=\"primary\">\n    <ion-title class=\"ion-text-center\">Sign-In</ion-title>\n  </ion-toolbar>\n</ion-header>\n<ion-progress-bar *ngIf=\"isLoading\" type=\"indeterminate\"></ion-progress-bar>\n\n<ion-content>\n  <form #f=\"ngForm\" (ngSubmit)=\"submitForm(f)\">\n    <ion-grid>\n      <ion-row>\n        <ion-col offset=\"0.7\" offset-md=\"1\" offset-sm=\"1\" size=\"10\">\n          <ion-item>\n            <ion-label position=\"floating\" class=\"ion-text-center\"\n              >E-mail</ion-label\n            >\n            <ion-input #emailCtrl=\"ngModel\" required type=\"e-mail\" ngModel name=\"e-mail\"></ion-input>\n            <ion-item lines=\"none\" *ngIf=\"emailCtrl.touched && emailCtrl.invalid\">\n              <ion-label> Please enter an E-mail</ion-label>\n            </ion-item>\n          </ion-item>\n        </ion-col>\n        <ion-col offset=\"0.7\" offset-md=\"1\" offset-sm=\"1\" size=\"10\">\n          <ion-item>\n            <ion-label position=\"floating\" class=\"ion-text-center\"\n              >Password</ion-label\n            >\n            <ion-input\n              required\n              minlength=\"6\"\n              type=\"password\"\n              ngModel\n              name=\"password\"\n              #passwordCtrl=\"ngModel\"\n            ></ion-input>\n            <ion-item lines=\"none\" *ngIf=\"passwordCtrl.touched && passwordCtrl.invalid\">\n              <ion-label> Please enter a Password</ion-label>\n            </ion-item>\n\n          </ion-item>\n        </ion-col>\n        <ion-col offset=\"4.2\" offset-md=\"5.6\" offset-sm=\"5.3\">\n          <ion-button type=\"submit\" *ngIf=\"!isLoading\" color=\"primary\"\n            >Sign-In</ion-button\n          >\n        </ion-col>\n      </ion-row>\n\n    </ion-grid>\n  </form>\n</ion-content>\n";
