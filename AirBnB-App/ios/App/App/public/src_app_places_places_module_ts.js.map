export default "<ion-header>\n  <ion-toolbar color=\"primary\">\n\n    <ion-buttons slot=\"start\">\n      <ion-menu-button></ion-menu-button>\n\n      <!-- <ion-back-button  [defaultHref]=\"'/places'\"></ion-back-button> -->\n    </ion-buttons>\n    <ion-title class=\"ion-text-center\">Offers</ion-title>\n    <ion-button slot=\"end\" [routerLink]=\"['/places/offers/new']\">\n      <ion-icon name=\"add\" slot=\"icon-only\"></ion-icon>\n    </ion-button>\n  </ion-toolbar>\n\n</ion-header>\n<ion-footer>\n  <ion-toolbar>\n    <app-tabs></app-tabs>\n  </ion-toolbar>\n</ion-footer>\n\n\n<ion-content>\n  <ion-grid class=\"ion-padding-top\" *ngIf=\"isLoading===false\">\n    <ion-row >\n      <ion-col size-lg=\"8\" offset-lg=\"2\">\n        <ion-list *ngIf=\"offers.length>0\" >\n          <!-- <p *ngIf=\"\">No offers found</p> -->\n          <ion-item-sliding *ngFor=\"let x of offers\" #slidingItem>\n\n          <ion-item  [routerLink]=\"['./',x.id]\">\n            <ion-thumbnail slot=\"start\">\n              <ion-img [src]=\"x.imageUrl\"></ion-img>\n            </ion-thumbnail>\n            <ion-label>\n              <h2>{{x.title}}</h2>\n              <p>{{x.description}}</p>\n            </ion-label>\n          </ion-item>\n          <ion-item-options>\n            <ion-item-option (click)=\"onEdit(x.id, slidingItem)\" color=\"danger\" [routerLink]=\"['/places/offers/edit/'+x.id]\">\n              <ion-icon name=\"create\" slot=\"icon-only\"></ion-icon>\n            </ion-item-option>\n          </ion-item-options>\n        </ion-item-sliding>\n\n        </ion-list>\n\n      </ion-col>\n    </ion-row>\n  </ion-grid>\n</ion-content>\n";
