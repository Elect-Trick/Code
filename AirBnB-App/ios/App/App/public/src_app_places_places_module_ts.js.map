export default "\n\n  <ion-tabs >\n    <ion-tab-bar color=\"primary\" slot=\"bottom\">\n      <ion-tab-button tab=\"discover\">\n        <!-- the tab identifier is what's used to navigate to the component in question-->\n<!-- We have to alter the top level component's routes and add these tab routes -->\n        <ion-icon name=\"search\"></ion-icon>\n        <ion-label>Discover</ion-label>\n        <ion-badge>{{_Places.length}}</ion-badge>\n      </ion-tab-button>\n\n      <ion-tab-button tab=\"offers\">\n        <ion-icon name=\"card\"></ion-icon>\n        <ion-label>Offers</ion-label>\n      </ion-tab-button>\n    </ion-tab-bar>\n  </ion-tabs>\n";
