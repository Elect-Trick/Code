export default "<ion-header>\n  <ion-toolbar color=\"primary\">\n    <ion-buttons slot=\"start\">\n      <ion-menu-button></ion-menu-button>\n    </ion-buttons>\n    <ion-title>Booked Places</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <!-- <ion-grid *ngIf=\"loadedBookings===null\">\n    <ion-row>\n      <ion-col size-md=\"6\" offset-md=\"3\">\n        <ion-label>\nThere are currently no bookings!\n        </ion-label>\n      </ion-col>\n    </ion-row>\n  </ion-grid> -->\n  <ion-grid>\n<ion-row>\n<ion-col size-md=\"6\" offset-md=\"3\" *ngIf=\"loadedBookings\">\n  <ion-label class=\"ion-text-center\" *ngIf=\"loadedBookings ===undefined\"> There are currently no bookings</ion-label>\n\n<ion-list >\n  <ion-item-sliding *ngFor=\"let booking of loadedBookings\" #slidingItem  >\n    <ion-item>\n      <ion-label>\n        <h5>{{booking.placeTitle}}</h5>\n        <P>Guests: {{booking.amountOfGuests}}</P>\n\n      </ion-label>\n      <!-- <ion-icon slot=\"end\" name=\"delete\"></ion-icon> -->\n\n    </ion-item>\n    <ion-item-options>\n      <ion-item-option color=\"danger\" (click)=\"cancelBooking(booking, slidingItem)\">\n        <ion-icon name=\"trash-outline\" slot=\"icon-only\"></ion-icon>\n      </ion-item-option>\n    </ion-item-options>\n  </ion-item-sliding>\n</ion-list>\n</ion-col>\n</ion-row>\n\n</ion-grid>\n</ion-content>\n";
