export default "<ion-header>\n  <ion-toolbar color=\"primary\">\n    <ion-buttons slot=\"start\">\n      <ion-back-button [defaultHref]=\"'/places/offers'\"></ion-back-button>\n    </ion-buttons>\n    <ion-title class=\"ion-text-center\">New Offer</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <form [formGroup]=\"form\">\n    <ion-grid>\n      <ion-row>\n        <ion-col size-sm=\"6\" offset-sm=\"3\">\n          <ion-item>\n            <ion-label position=\"floating\"> Title: </ion-label>\n            <ion-input\n              formControlName=\"title\"\n              type=\"text\"\n              autocomplete\n              autocorrect\n            ></ion-input>\n          </ion-item>\n        </ion-col>\n      </ion-row>\n      <ion-row>\n        <ion-col size-sm=\"6\" offset-sm=\"3\">\n          <ion-item>\n            <ion-label position=\"floating\"> Description: </ion-label>\n            <ion-textarea\n              type=\"text\"\n              rows=\"3\"\n              autocomplete\n              autocorrect\n              formControlName=\"description\"\n            ></ion-textarea>\n          </ion-item>\n        </ion-col>\n      </ion-row>\n      <ion-row>\n        <ion-col size-sm=\"6\" offset-sm=\"3\">\n          <ion-item>\n            <ion-label position=\"floating\"> Price: </ion-label>\n            <ion-input\n              min=\"0\"\n              type=\"number\"\n              rows=\"3\"\n              autocomplete\n              autocorrect\n              formControlName=\"price\"\n            ></ion-input>\n          </ion-item>\n        </ion-col>\n      </ion-row>\n      <ion-row>\n        <ion-col size-md=\"4\" offset-md=\"3\" offset-sm=\"3\">\n          <ion-item lines=\"inset\" (click)=\"openStartDate()\">\n            <ion-label>From:</ion-label>\n            <ion-text maxlength=\"180\" slot=\"end\"\n              >{{formatedStartDate}}</ion-text\n            >\n          </ion-item>\n          <ion-datetime\n            (ionChange)=\"startDateChanged($event)\"\n            [presentation]=\"date\"\n            *ngIf=\"startDateSelected\"\n            formControlName=\"startDate\"\n            [ngModel]=\"_start\"\n          >\n          </ion-datetime>\n        </ion-col>\n      </ion-row>\n\n      <ion-row>\n        <ion-col size-md=\"4\" offset-md=\"3\" offset-sm=\"3\">\n          <ion-item lines=\"inset\" (click)=\"openEndDate()\">\n            <ion-label>To:</ion-label>\n            <ion-text slot=\"end\"> {{formatedEndDate}} </ion-text>\n          </ion-item>\n          <ion-datetime\n            (ionChange)=\"endDateChanged($event)\"\n            [presentation]=\"date\"\n            *ngIf=\"endDateSelected\"\n            formControlName=\"endDate\"\n            [(ngModel)]=\"selectedEndDate\"\n          >\n          </ion-datetime>\n        </ion-col>\n\n            </ion-row>\n\n            <!-- <ion-row *ngIf=\"_mapOpened===true\">\n              <ion-col>\n\n                <app-map></app-map>\n\n              </ion-col>\n            </ion-row> -->\n            <!-- <ion-button (click)=\"mapOpened()\">\n              <ion-icon name=\"location\" slot=\"icon-only\">\n\n              </ion-icon>\n              Add Location\n              </ion-button> -->\n      <!-- <ion-row>\n        <ion-col offset-md=\"5\" offset-sm=\"5\" offset=\"3.2\">\n          <ion-button\n            [disabled]=\"!form.valid\"\n            (click)=\"createBooking()\"\n            type=\"submit\"\n            color=\"primary\"\n            >Create Offer</ion-button\n          >\n        </ion-col>\n      </ion-row> -->\n    </ion-grid>\n  </form>\n</ion-content>\n";
