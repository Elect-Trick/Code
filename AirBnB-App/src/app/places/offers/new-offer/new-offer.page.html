<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="'/places/offers'"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center">New Offer</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="form">
    <ion-grid>
      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-item>
            <ion-label position="floating"> Title: </ion-label>
            <ion-input
              formControlName="title"
              type="text"
              autocomplete
              autocorrect
            ></ion-input>
          </ion-item>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-item>
            <ion-label position="floating"> Description: </ion-label>
            <ion-textarea
              type="text"
              rows="3"
              autocomplete
              autocorrect
              formControlName="description"
            ></ion-textarea>
          </ion-item>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-item>
            <ion-label position="floating"> Price: </ion-label>
            <ion-input
              min="0"
              type="number"
              rows="3"
              autocomplete
              autocorrect
              formControlName="price"
            ></ion-input>
          </ion-item>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size-md="4" offset-md="3" offset-sm="3">
          <ion-item lines="inset" (click)="openStartDate()">
            <ion-label>From:</ion-label>
            <ion-text maxlength="180" slot="end"
              >{{formatedStartDate}}</ion-text
            >
          </ion-item>
          <ion-datetime
            (ionChange)="startDateChanged($event)"
            [presentation]="date"
            *ngIf="startDateSelected"
            formControlName="startDate"
            [ngModel]="_start"
          >
          </ion-datetime>
        </ion-col>

        <ion-col size-md="4" offset-md="3" offset-sm="3">
          <ion-item lines="inset" (click)="openEndDate()">
            <ion-label>To:</ion-label>
            <ion-text slot="end"> {{formatedEndDate}} </ion-text>
          </ion-item>
          <ion-datetime
            (ionChange)="endDateChanged($event)"
            [presentation]="date"
            *ngIf="endDateSelected"
            formControlName="endDate"
            [(ngModel)]="selectedEndDate"
          >
          </ion-datetime>
        </ion-col>
      </ion-row>

      <ion-row >
        <ion-col offset="3.5">
          <ion-button type="file" (click)="pickImages()">
            <ion-icon name="location" slot="icon-only">

            </ion-icon>
            Add Media
          </ion-button>
        </ion-col>

      </ion-row>
      <ion-row>
        <ion-col offset-md="5" offset-sm="5" offset="3.2">
          <ion-button
            [disabled]="!form.valid"
            (click)="createBooking()"
            type="submit"
            color="primary"
            >Create Offer</ion-button
          >
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
</ion-content>
