<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="'/places/discover'"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row fixed>
      <ion-col size-lg="8" offset-lg="2" class="ion-text-center">
        <ion-card>
          <ion-card-header>
            <ion-card-title>{{place.title}}</ion-card-title>
            <ion-card-subtitle
              >{{place.price | currency}}/Night</ion-card-subtitle
            >
          </ion-card-header>

          <ion-img [src]="place.imageUrl"></ion-img>
          <ion-card-content>
            <p>{{place.description}}</p>
          </ion-card-content>
                </ion-card>
      </ion-col>
    </ion-row>
    <ion-button *ngIf="isBookable===true" expand="full" (click)="bookPlace()" color="primary">Book</ion-button>

  </ion-grid>
</ion-content>
