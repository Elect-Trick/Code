<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="primary">
      <ion-button slot="primary" (click)="onCancel()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="ion-text-center">{{ selectedPlace.title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="form" (ngSubmit)="createBooking()">
    <ion-grid>
      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-item>
            <ion-label position="floating">First Name</ion-label>
            <ion-input
              type="text"
              formControlName="firstName"
              required
            ></ion-input>
          </ion-item>
        </ion-col> </ion-row
      ><ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-item>
            <ion-label position="floating">Last Name</ion-label>
            <ion-input
              type="text"
              formControlName="lastName"
              required
            ></ion-input>
          </ion-item>
        </ion-col>
      </ion-row >
      <ion-row (click)="guestsClicked()">
        <ion-col size-sm="6" offset-sm="3">
          <ion-item>
            <ion-label position="floating">Guests</ion-label>
            <ion-select
              [ngModel]="'2'"
              class="ion-text-end"
              formControlName="guests"

            >
              <ion-select-option value="1">1</ion-select-option>
              <ion-select-option value="2">2</ion-select-option>
              <ion-select-option value="3">3</ion-select-option>
            </ion-select>
          </ion-item>
        </ion-col>
      </ion-row>


        <ion-row *ngIf="_guestsClicked">
          <ion-col size-md="4" offset-md="3" offset-sm="3">
            <ion-item lines="inset" (click)="openStartDate()">
              <ion-label>From:</ion-label>
              <ion-text slot="end">{{ formatedStartDate }}</ion-text>
            </ion-item>
            <ion-datetime
              (ionChange)="startDateChanged($event)"
              [presentation]="date"
              *ngIf="startDateSelected"
              formControlName="startDate"
              [(ngModel)]="formatedStartDate"
            >
            </ion-datetime>
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-col size-md="4" offset-md="3" offset-sm="3">
            <ion-item lines="inset" (click)="openEndDate()">
              <ion-label>To:</ion-label>
              <ion-text slot="end"> {{ formatedEndDate }} </ion-text>
            </ion-item>
            <ion-datetime
              (ionChange)="endDateChanged($event)"
              [presentation]="date"
              *ngIf="endDateSelected"
              formControlName="endDate"
              [min]="formatedStartDate"
            >

            </ion-datetime>
          </ion-col>
        </ion-row>
      <ion-row>
        <ion-col class="ion-text-center">
          <!-- <p class="ion-text-center">{{ selectedPlace.description }}</p> -->
          <ion-button type="submit"  color="primary"
            >Book</ion-button
          >
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
</ion-content>
