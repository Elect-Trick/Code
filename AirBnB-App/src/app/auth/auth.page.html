<ion-header>
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">Sign-In</ion-title>
  </ion-toolbar>
</ion-header>
<ion-progress-bar *ngIf="isLoading" type="indeterminate"></ion-progress-bar>

<ion-content>
  <form [formGroup]="form" (ngSubmit)="submitForm()">
    <ion-grid>
      <ion-row>
        <ion-col offset="0.7" offset-md="1" offset-sm="1" size="10">
          <ion-item>
            <ion-label position="floating" class="ion-text-center"
              >E-mail</ion-label
            >
            <ion-input
              formControlName="email"
              required
              type="e-mail"
            ></ion-input>
          </ion-item>
        </ion-col>
        <ion-col offset="0.7" offset-md="1" offset-sm="1" size="10">
          <ion-item>
            <ion-label position="floating" class="ion-text-center"
              >Password</ion-label
            >
            <ion-input
              required
              minlength="6"
              type="password"
              formControlName="password"
            ></ion-input>
          </ion-item>
        </ion-col>
        <ion-col offset="4.2" offset-md="5.6" offset-sm="5.3">
          <ion-button type="submit" *ngIf="!isLoading" color="primary"
            >Sign-In</ion-button
          >
        </ion-col>
      </ion-row>
      <br />
      <ion-row>
        <ion-col offset="3.5" offset-md="5.3" offset-lg="5.4">
          <ion-label (click)="isNewUser()"> New User? Click here </ion-label>
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
</ion-content>
