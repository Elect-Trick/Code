<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button> </ion-menu-button>
      <!-- <ion-back-button [defaultHref]="'/places'"></ion-back-button> -->
    </ion-buttons>
    <ion-title class="ion-text-center"> Discover</ion-title>
  </ion-toolbar>
</ion-header>
<ion-footer>
  <ion-toolbar>
    <app-tabs></app-tabs>
  </ion-toolbar>
</ion-footer>

<ion-content>
  <ion-segment value="all" (ionChange)="selectedSegment($event)">
    <ion-segment-button checked value="all"> All Places </ion-segment-button>
    <ion-segment-button value="bookable"> Bookable places </ion-segment-button>
  </ion-segment>
  <ion-grid *ngIf="bookablePlaces.length <=0">
    <ion-row>
      <ion-col size-lg="8" offset-lg="2" class="ion-text-center">
        <p>There are no bookable places available right now, try again later!</p>
      </ion-col>
    </ion-row>
  </ion-grid>
  <ion-grid class="ion-padding-top" *ngIf="bookablePlaces.length >0">
    <ion-row fixed>
      <ion-col size-lg="8" offset-lg="2" class="ion-text-center">
        <ion-card>
          <ion-card-header>
            <ion-card-title>{{bookablePlaces[0].title}}</ion-card-title>
            <ion-card-subtitle
              >{{bookablePlaces[0].price | currency}}/Night</ion-card-subtitle
            >
          </ion-card-header>

          <ion-img [src]="bookablePlaces[0].imageUrl"></ion-img>
          <ion-card-content>
            <p>{{bookablePlaces[0].description}}</p>
          </ion-card-content>
          <div class="ion-text-right">
            <ion-button
              fill="clear"
              color="primary"
              [routerLink]="['./',bookablePlaces[0].id]"
              >More</ion-button
            >
          </div>
        </ion-card>
      </ion-col>
    </ion-row>

    <ion-row class="ion-padding-right">
      <ion-col>
        <!-- Ion virtual scroll takes the place of the ionlist, remove *ngFor and bind an items property, then add *virtualItem to the item tag -->
        <!-- For better perfomance, you need to apprixomate the list height, therefor give it the approxItemHeight=70px or whatever value you need  -->

        <ion-list>
          <ion-item
            *ngFor="let place of bookablePlaces.slice(1)"
            [routerLink]="['./',place.id]"
          >
            <ion-thumbnail slot="start">
              <ion-img [src]="place.imageUrl"></ion-img>
            </ion-thumbnail>
            <ion-label>
              <h2>{{place.title}}</h2>
              <p>{{place.description}}</p>
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
