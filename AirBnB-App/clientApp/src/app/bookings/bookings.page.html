<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Booked Places</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- <ion-grid *ngIf="loadedBookings===null">
    <ion-row>
      <ion-col size-md="6" offset-md="3">
        <ion-label>
There are currently no bookings!
        </ion-label>
      </ion-col>
    </ion-row>
  </ion-grid> -->
  <ion-grid>
<ion-row>
<ion-col size-md="6" offset-md="3" *ngIf="loadedBookings">
  <ion-label class="ion-text-center" *ngIf="loadedBookings ===undefined"> There are currently no bookings</ion-label>

<ion-list >
  <ion-item-sliding *ngFor="let booking of loadedBookings" #slidingItem  >
    <ion-item>
      <ion-label>
        <h5>{{booking.placeTitle}}</h5>
        <P>Guests: {{booking.amountOfGuests}}</P>

      </ion-label>
      <!-- <ion-icon slot="end" name="delete"></ion-icon> -->

    </ion-item>
    <ion-item-options>
      <ion-item-option color="danger" (click)="cancelBooking(booking, slidingItem)">
        <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
      </ion-item-option>
    </ion-item-options>
  </ion-item-sliding>
</ion-list>
</ion-col>
</ion-row>

</ion-grid>
</ion-content>
