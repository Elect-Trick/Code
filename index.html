<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"
    ></script>
    <script
      nomodule
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css"
    />
    <title>Budget Planner</title>
  </head>
  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title> Budget Planner </ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-grid>
          <ion-row>
            <ion-col size-md="6" offset-md="3">
              <ion-card>
                <ion-card-header>
                  <ion-card-title>New Expense</ion-card-title>
                </ion-card-header>
                <ion-card-content>
                  <ion-item>
                    <ion-label position="floating">Expense Reason</ion-label>
                    <ion-input type="text" id="expense"></ion-input>
                  </ion-item>

                  <ion-item>
                    <ion-label position="floating">Expense Amount</ion-label>
                    <ion-input type="number" id="expenseAmount"></ion-input>
                  </ion-item>
                  <div margin-vertical text-right>
                  <ion-button id="addExpense"
                    >Add Expense
                    <ion-icon name="add-outline" slot="start"></ion-icon>
                  </ion-button>
                  <ion-button id="clear" fill="outline" color="danger"
                    >Clear
                    <ion-icon slot="start" name="close"></ion-icon>
                  </ion-button>
                </div>
                </ion-card-content>
              </ion-card>
            </ion-col>
          </ion-row>

          <ion-row> 
              <ion-col> 
                  <ion-list id="expenseList">    </ion-list>
              </ion-col>
          </ion-row>   

          <ion-row>
              <ion-col size-md="6">
                  <p margin>Total Expenses: <span id="totalExpenses"></span></p>
              </ion-col>
          </ion-row>
        </ion-grid>
      </ion-content>
      <ion-alert-controller>
          <ion-alert>
      </ion-alert-controller>
    </ion-app>
    <script src="app.js"></script>
  </body>
</html>
