<div class="text-center mt-3">
  <h2>{{ pagination?.totalItems }} Matches Found</h2>
</div>

<div class="container mt-3">
  <form
    #form="ngForm"
    (ngSubmit)="getAllMembers()"
    class="form-inline mb-3"
    autocomplete="off"
  >
    <div class="form-group">
      <label>Age from: </label>
      <input
        type="number"
        class="form-control ml-1"
        style="width: 70px"
        name="minAge"
        [(ngModel)]="userParams.minAge"
      />

      <label style="margin-left: 10px">Age To: </label>
      <input
        type="number"
        class="form-control ml-1"
        style="width: 70px"
        name="maxAge"
        [(ngModel)]="userParams.maxAge"
      />

      <label style="margin-left: 10px">Show: </label>
      <select
        [(ngModel)]="userParams.gender"
        name="gender"
        style="width: 130px"
        class="form-control ml-1"
      >
        <option ng *ngFor="let gender of genderList" [value]="gender.value">
          {{ gender.display }}
        </option>
      </select>

      <button (click)="getAllMembers()" class="btn btn-primary ml-4" type="submit">Apply Filters</button>
      <button
        (click)="resetFilters()"
        class="btn btn-primary ml-1"
        type="submit"
      >
        Reset Filters
      </button>
      <div class="btn-group float-right">
        <button
          type="button"
          btnRadio="lastActive"
          class="btn btn-primary"
          name="orderBy"
          (click)="getAllMembers()"
          [(ngModel)]="userParams.orderBy"
        >
          Last Active
        </button>
        <button
          style="margin-left: 10px"
          type="button"
          btnRadio="profileRegistered"
          class="btn btn-primary"
          name="orderBy"
          (click)="getAllMembers()"
          [(ngModel)]="userParams.orderBy"
        >
          Profile Registered
        </button>
      </div>
    </div>
  </form>
</div>

<div class="row">
  <div *ngFor="let x of members" class="col-2">
    <app-member-card [member]="x"></app-member-card>
  </div>
</div>
<div class="text-center" *ngIf="pagination">
  <pagination
    [boundaryLinks]="true"
    [totalItems]="pagination.totalItems"
    [itemsPerPage]="pagination.itemsPerPage"
    [(ngModel)]="pagination.currentPage"
    (pageChanged)="pageChanged($event)"
    previousText="&lsaquo;"
    nextText="&rsaquo;"
    firstText="&laquo;"
    lastText="&raquo;"
  >
  </pagination>
</div>
