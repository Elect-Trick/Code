<div style="margin-bottom: 5px" class="container mb-5">
  <div style="text-align: center" *ngIf="!registerMode">
    <h1>Find your Match</h1>
    <p class="lead">
      Come on in to view your matches... all you need to do is sign up
    </p>
  </div>
  <div class="text-center" *ngIf="!registerMode">
    <button
      style="margin-right: 10px"
      (click)="registerToggle()"
      class="btn btn-primary btn-lg"
    >
      Register
    </button>
    <button class="btn btn-info btn-lg">Learn More</button>
  </div>
</div>

<div class="container justfiy-content-center" *ngIf="registerMode">
  <!-- Register component is a child of the home component -->
    <!-- <app-register [usersFromHomeComponent]="allUsers" (cancelRegistration)="cancelRegister($event)"></app-register> -->
    <app-register (cancelRegistration)="cancelRegister($event)"></app-register>


</div>
