<div class="form-group">
  <input type="text" name="" id=""[class.is-invalid]='ngControl.touched && ngControl.invalid'
  class="form-control"
  [formControl]='$any(ngControl.control)'
  bsDatepicker
  [bsConfig]="bsConfig"
  [maxDate]="maxDate"
  placeholder="Date of Birth">

</div>

<div class="invalid-feedback" *ngIf="ngControl?.control?.errors?.['required']">
  {{label}} is required
</div>
