<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<div class="form-group">
  <ion-input

    placeholder="Confirm Password"
    required
    [class.is-invalid]="ngControl.touched && ngControl.invalid"
    type="{{ type }}"
    [formControl]="$any(ngControl.control)"
    placeholder="{{ label }}">
  </ion-input>


  <div
    *ngIf="ngControl.control?.errors?.['required']"
    class="text-danger text-center"
  >
    Please enter a {{ label }}
  </div>
  <div
    *ngIf="ngControl.control?.errors?.['minlength']"
    class="text-danger text-center"
  >
    {{ label }} at least
    {{ngControl.control?.errors?.['minlength']['requiredLength']}} characters
  </div>
  <div
    *ngIf="ngControl.control?.errors?.['maxlength']"
    class="text-danger text-center"
  >
    {{ label }} must be at least most
    {{ngControl.control?.errors?.['maxlength']['requiredLength']}}
  </div>
</div>
